<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>2026 헷반</title>

    <style>


        * {
            box-sizing: border-box;
        }

        body {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            font-size: 20pt;
        }

        h1 {
            text-align: center;

            font-size: 1.5em;
        }

        h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;

        }
.navBox {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 25px;

    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
}

.nav-column {
    display: flex;
    flex: 0 1 300px;
    flex-direction: column;
    gap: 25px;
    min-width: 0;
}

.nav-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;

    width: 100%;
    margin: 0;
    padding: 15px 25px;

    border: 1px solid #555;
    border-radius: 20px;
}
        .nav-btn {
            width: 200px;
            max-width: 100%;
            text-align: center;
            padding: 10px 16px;
            background: #2d2d2d;
            color: #d4d4d4;
            border: 1px solid #444;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.8em;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #007acc;
            color: #fff;
            border-color: #007acc;
        }
    </style>
</head>

<body>

    <h1>2026년 6학년 헷-반</h1>

    <div class="navBox">

        <div class="nav-bar">
            <h2>클래스보드</h2>

            <a href="https://kimgreentea.github.io/kimnokcha/oncheck/nogoodbike/nogoodbike" class="nav-btn"><hi style="font-size:.9em;">불량한 자전거 여행</hi></a>

        <div class="nav-bar">
            <h2>수학</h2>

    </div>
<script>
    const navBox = document.querySelector('.navBox');
    const cards = [...navBox.querySelectorAll('.nav-bar')];

    function arrangeCards() {
        const availableWidth = Math.min(
            navBox.parentElement.clientWidth,
            1500
        );

        const columnCount = Math.max(
            1,
            Math.floor((availableWidth + 25) / 325)
        );

        const columns = Array.from(
            { length: columnCount },
            () => {
                const column = document.createElement('div');
                column.className = 'nav-column';
                return column;
            }
        );

        cards.forEach((card, index) => {
            columns[index % columnCount].appendChild(card);
        });

        navBox.replaceChildren(...columns);
    }

    arrangeCards();

    window.addEventListener('resize', arrangeCards);
</script>
</body>

</html>

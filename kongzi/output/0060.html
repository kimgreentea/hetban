<h1>자왈: "사군진례, 인이위첨야."</h1>


<h3 class="stress" id="TABLE_OF_CONTENT1">원문</h3>
<p class="txt">子曰: "事君盡禮, 人以爲諂也."<br/>(자왈: "사군진례, 인이위첨야.")</p>
<h3 class="stress" id="TABLE_OF_CONTENT2">문법 설명 및 어휘 풀이</h3>
<p class="txt">1) 人以爲諂(인이위첨): 사람들이 아첨한다고 여기다.<br/>• 以爲(이위): ~라고 여기다.</p>
<h3 class="stress" id="TABLE_OF_CONTENT3">통해</h3>
<p class="txt">공자께서 말씀하셨다. "임금을 섬김에 있어서 예를 다하면 사람들은 아첨한다고 여긴다." (신하가 임금에게 무례한 것이 보편적인 현상임을 개탄한 것이다.)</p>

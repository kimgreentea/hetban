<h1>자왈: "지어도, 거어덕, 의어인, 유어예."</h1>


<h3 class="stress" id="TABLE_OF_CONTENT1">원문</h3>
<p class="txt">子曰: "志於道, 據於德, 依於仁, 游於藝."<br/>(자왈: "지어도, 거어덕, 의어인, 유어예.")</p>
<h3 class="stress" id="TABLE_OF_CONTENT2">문법 설명 및 어휘 풀이</h3>
<p class="txt">1) 游於藝(유어예): 육예에 노닐다.<br/>• 藝(예): 옛날 선비들이 반드시 배워야 할 여섯 가지의 일, 즉 禮(예: 예법)·樂(악: 음악)·射(사: 활쏘기)·御(어: 마차 운전)·書(서: 서예)·數(수: 수학)의 육예를 가리킨다.</p>
<h3 class="stress" id="TABLE_OF_CONTENT3">통해</h3>
<p class="txt">공자께서 말씀하셨다. "도에 뜻을 두고, 덕에 근거하고, 인에 의지하고, 육예에 노닐어라."</p>

<h1>자왈: "방어리이행, 다원."</h1>


<h3 class="stress" id="TABLE_OF_CONTENT1">원문</h3>
<p class="txt">子曰: "放於利而行, 多怨."<br/>(자왈: "방어리이행, 다원.")</p>
<h3 class="stress" id="TABLE_OF_CONTENT2">문법 설명 및 어휘 풀이</h3>
<p class="txt">1) 放於利而行(방어리이행): 이익에 따라서 행동하다.<br/>• 放(방): 의거하다.</p>
<blockquote>
<p>吾子使天下無失其朴, 吾子亦放風而動.(오자사천하무실기박, 오자역방풍이동.)<br/>선생은 천하로 하여금 소박함을 잃지 않게 하고 선생 자신도 바람을 따라 자연스럽게 움직이십시오.</p>
<em class="blockquote_source_bottom">『莊子(장자)·天運(천운)』</em>
</blockquote>
<h3 class="stress" id="TABLE_OF_CONTENT3">통해</h3>
<p class="txt">공자께서 말씀하셨다. "이익에 따라서 행동하면 원망이 많다."</p>

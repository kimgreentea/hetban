<h1>자왈: "군자유어의, 소인유어리."</h1>


<h3 class="stress" id="TABLE_OF_CONTENT1">원문</h3>
<p class="txt">子曰: "君子喩於義, 小人喩於利."<br/>(자왈: "군자유어의, 소인유어리.")</p>
<h3 class="stress" id="TABLE_OF_CONTENT2">문법 설명 및 어휘 풀이</h3>
<p class="txt">1) 喩於義(유어의): 정의에 관하여 밝히 알다.<br/>• 喩(유): 밝다, 밝히 알다.<br/>• 於(어): 동작의 대상을 표시하는 전치사.</p>
<h3 class="stress" id="TABLE_OF_CONTENT3">통해</h3>
<p class="txt">공자께서 말씀하셨다. "군자는 정의에 밝고 소인은 이익에 밝다."</p>

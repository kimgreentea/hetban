<h1>자이사교: 문행충신.</h1>


<h3 class="stress" id="TABLE_OF_CONTENT1">원문</h3>
<p class="txt">子以四敎: 文行忠信.<br/>(자이사교: 문행충신.)</p>
<h3 class="stress" id="TABLE_OF_CONTENT2">문법 설명 및 어휘 풀이</h3>
<p class="txt">1) 子以四敎(자이사교): 공자가 네 가지를 가르치다.<br/>• 以(이): 동작의 대상 즉 직접 목적어를 표시하는 전치사. 四(사)가 敎(교)의 대상임을 표시한다.</p>
<blockquote>
<p>舊令尹之政, 必以告新令尹.(구령윤지정, 필이고신령윤.)<br/>전임 영윤의 정사를 반드시 후임 영윤에게 일러주었습니다.</p>
<em class="blockquote_source_bottom">『論語(논어)·公冶長(공야장) 19』</em>
</blockquote>
<h3 class="stress" id="TABLE_OF_CONTENT3">통해</h3>
<p class="txt">공자께서는 네 가지를 가르치셨으니 경전과 덕행과 충성과 신의가 그것이다.</p>

<h1>자왈: "유인자능호인, 능오인."</h1>


<h3 class="stress" id="TABLE_OF_CONTENT1">원문</h3>
<p class="txt">子曰: "惟仁者能好人, 能惡人."<br/>(자왈: "유인자능호인, 능오인.")</p>
<h3 class="stress" id="TABLE_OF_CONTENT2">문법 설명 및 어휘 풀이</h3>
<p class="txt">1) 能惡人(능오인): 다른 사람을 미워할 수 있다.<br/>• 惡(미워할오): '미워하다, 증오하다'라는 뜻의 동사.</p>
<h3 class="stress" id="TABLE_OF_CONTENT3">통해</h3>
<p class="txt">공자께서 말씀하셨다. "오직 어진 사람만이 다른 사람을 좋아할 수 있고 또한 미워할 수 있다." (오직 인자만이 선악을 판단할 수 있다는 말이다.)</p>

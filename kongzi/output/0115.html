<h1>자왈: "녕무자, 방유도즉지, 방무도즉우."</h1>


<h3 class="stress" id="TABLE_OF_CONTENT1">원문</h3>
<p class="txt">子曰: "甯武子, 邦有道則知, 邦無道則愚. 其知可及也, 其愚不可及也."<br/>(자왈: "녕무자, 방유도즉지, 방무도즉우. 기지가급야, 기우불가급야.")</p>
<h3 class="stress" id="TABLE_OF_CONTENT2">문법 설명 및 어휘 풀이</h3>
<p class="txt">1) 甯武子(녕무자): 위(衛)나라 대부 영유(甯兪). 武(무)는 그의 시호.</p>
<h3 class="stress" id="TABLE_OF_CONTENT3">통해</h3>
<p class="txt">공자께서 말씀하셨다. "영무자는 나라에 도가 있으면 지혜롭게 행동하고 나라에 도가 없으면 어리석게 굴었다. 그의 지혜로움은 따라갈 수 있지만 그의 어리석음은 따라갈 수 없다."</p>

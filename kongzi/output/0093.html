<h1>자왈: "덕불고, 필유린."</h1>


<h3 class="stress" id="TABLE_OF_CONTENT1">원문</h3>
<p class="txt">子曰: "德不孤, 必有隣."<br/>(자왈: "덕불고, 필유린.")</p>
<h3 class="stress" id="TABLE_OF_CONTENT2">문법 설명 및 어휘 풀이</h3>
<p class="txt">1) 德不孤(덕불고): 덕은 외롭지 않다.<br/>• 德(덕): 덕이 있는 사람을 가리킨다.</p>
<h3 class="stress" id="TABLE_OF_CONTENT3">통해</h3>
<p class="txt">공자께서 말씀하셨다. "덕이 있는 사람은 외롭지 않고 반드시 이웃이 있다."</p>

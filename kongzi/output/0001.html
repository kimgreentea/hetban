<p class="txt"><strong>류종목</strong><br/>지은이 류종목은 서울대학교 중어중문학과를 졸업하였으며 동대학원에서 문학박사 학위를 받았다. 현재 서울대학교 중어중문학과 교수로 재직 중이다.<br/><br/>저서로 『소식사연구(蘇軾詞硏究)』 『중문학 어떻게 공부할까』와 역서로 『여산진면목』 『당송사사(唐宋詞史)』 『동서양 시의 이해』 등이 있다.</p>

<h1>자어시일곡, 즉불가.</h1>


<h3 class="stress" id="TABLE_OF_CONTENT1">원문</h3>
<p class="txt">子於是日哭, 則不歌.<br/>(자어시일곡, 즉불가.)</p>
<h3 class="stress" id="TABLE_OF_CONTENT2">문법 설명 및 어휘 풀이</h3>
<p class="txt">1) 是日(시일): 이날.<br/>• 是(시): 막연한 것을 가리키는 지시대사. '어느 것이든'이라는 의미를 내포하고 있다.</p>
<blockquote>
<p>夫子至於是邦也, 必聞其政.(부자지어시방야, 필문기정.)<br/>선생님께서는 한 나라에 가면 꼭 그 나라의 정치에 관한 이야기를 들으셨다.</p>
<em class="blockquote_source_bottom">『論語(논어)·學而(학이) 10』</em>
</blockquote>
<h3 class="stress" id="TABLE_OF_CONTENT3">통해</h3>
<p class="txt">공자께서는 어느 날 곡을 하시면 그날은 노래를 부르지 않으셨다.</p>

<h1>자온이려, 위이불맹, 공이안.</h1>


<h3 class="stress" id="TABLE_OF_CONTENT1">원문</h3>
<p class="txt">子溫而厲, 威而不猛, 恭而安.<br/>(자온이려, 위이불맹, 공이안.)</p>
<h3 class="stress" id="TABLE_OF_CONTENT2">문법 설명 및 어휘 풀이</h3>
<p class="txt">1) 恭而安(공이안): 공손하면서도 (다른 사람이 대하기가) 편안하다. 지나치게 공손하면 오히려 대하기가 어려운 법인데 공자는 그렇지 않고 편안하게 대할 수 있었다는 뜻이다.</p>
<h3 class="stress" id="TABLE_OF_CONTENT3">통해</h3>
<p class="txt">공자께서는 온화하면서도 엄숙하시고, 위엄이 있으면서도 사납지 않으시고, 공손하면서도 대하기에 편안하셨다.</p>
